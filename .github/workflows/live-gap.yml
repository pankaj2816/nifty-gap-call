name: Live gap log

on:
  schedule:
    # Every 15 minutes from 08:00 to 16:00 IST, Monday to Friday.
    # A new call is still locked once, before the open. Later checks only save the gap, the close, and a reason if the call was wrong.
    - cron: "*/15 2-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update the prediction log and page
        run: python backend/scripts/update_live_log.py
        env:
          PYTHONPATH: backend
      - name: Publish the updated log
        run: |
          git config user.name "gap-log"
          git config user.email "gap-log@users.noreply.github.com"
          git add live_log docs
          if git diff --staged --quiet; then
            echo "No log changes."
            exit 0
          fi
          git commit -m "Update the live gap log"
          git push
